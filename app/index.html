<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- The content policy travels with the page, so every copy of the app carries it. The script hash is the import
       map's (tests/csp.mjs checks it); a copy without the import map (tools/construir.sh) needs nothing more. The three
       style hashes are the fixed styles of Oksigenia's accessibility panel 0.12.0 at position="bottom-left": its
       effects, its own sheet and the colour-blind filters' SVG (that one is an attribute, hence 'unsafe-hashes').
       They change with the panel's version or its attributes; the walk fails on any refusal and prints the new hash. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-Fr0fF0sjU47PxvRygowzV9fmZP537864zpBdG8tWPmc=' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-hashes' 'sha256-S7ClRAmGJq3evHjIDEpITgQRsrKVzPiY8x2s1HkH4Kg=' 'sha256-4wOm3BwddL5VP97matJWlHbRkq9UhogcJWNPtIU220A=' 'sha256-HXpdsTS7aV+r+X2zQtxJcxGFkx9YDkRb2LwtnZjFr/E=' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4e6e3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121517" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="fuentes/red-hat-text.woff2" as="font" type="font/woff2" crossorigin>
  <title>Rutina</title>
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="icon" href="iconos/icono-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="iconos/icono-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <link rel="stylesheet" href="estilos.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
  <script src="vendor/qrcode/qrcode.js" defer></script>
  <script src="tema.js"></script>
  <script type="module" src="vendor/oksigenia-access-panel/oksigenia-access-panel.js?v=0.12.0"></script>
</head>
<body>
  <main id="app"></main>
  <!-- Oksigenia's accessibility panel, opened from «Accesibilidad» beside the signature (app.js): no floating button
       over the figure or over «Empezar». No text size: the app is sized in px, so it would change nothing; the
       browser's zoom does it. Its fixed styles need their hashes in the content policy (above, and in tests/servir.py):
       they change with the panel's version and with its position. -->
  <oksigenia-access-panel trigger="none" locale="es" position="bottom-left" storage-key="jepyso"
    controls="line-height,letter-spacing,readable-font,dyslexia-font,contrast,highlight-links,colorblind,reading-guide,big-cursor,big-targets,pause-anim,focus"></oksigenia-access-panel>
  <script type="module" src="app.js"></script>
</body>
</html>
