<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Where the Dropbox and Microsoft windows come back to with their answer (conectar.js, oauth.js). Only its own
       script and styles; it talks to no one. No referrer: the address carries the one-use code. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Jepyso</title>
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="conectar">
    <p class="conectar-aviso" aria-live="polite"></p>
    <a class="boton secundario" href="./" hidden></a>
  </main>
  <script type="module" src="conectar.js"></script>
</body>
</html>
